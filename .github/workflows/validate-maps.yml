name: Validate device map consolidation
on:
  pull_request:
  push:
    branches: [codex/maps-consolidation-2026-09-24]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - run: python tools/device-maps/validate_consolidation.py --site-dir site
